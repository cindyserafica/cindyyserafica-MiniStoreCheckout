<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #productsContainer {
            margin-top: 20px;
        }

        .product-box {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        #validationMessage {
            margin-top: 15px;
            font-weight: bold;
        }

        #orderSummary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #ddd;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MINI STORE CHECKOUT SYSTEM</h1>

    <label for="customerName">Customer Name:</label>
    <input type="text" id="customerName" placeholder="Customer Name">

    <label for="productCount">Number of Products:</label>
    <input type="number" id="productCount" min="1" placeholder="Number of Products">

    <div id="productsContainer"></div>

    <div id="validationMessage"></div>

    <label for="deliveryOption">Delivery Option:</label>
    <select id="deliveryOption">
        <option value="">Select Delivery Option</option>
        <option value="1">Store Pickup</option>
        <option value="2">Standard Delivery</option>
        <option value="3">Express Delivery</option>
    </select>

    <button id="calculateBtn">Calculate Order</button>

    <h2>Order Summary</h2>

    <div id="orderSummary"></div>

</div>

<script src="script.js"></script>

</body>
</html>
